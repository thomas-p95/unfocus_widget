name: unfocus_widget
description: >
  Dismiss the Flutter keyboard when tapping outside TextField widgets.
  Lightweight unfocus widget for forms, login screens, and search fields.
  Tap outside to hide keyboard with MaterialApp.builder or Scaffold.
version: 0.1.2+1
homepage: https://simpleman.dev
repository: https://github.com/thomas-p95/unfocus_widget
issue_tracker: https://github.com/thomas-p95/unfocus_widget/issues
topics:
  - flutter
  - keyboard
  - textfield
  - unfocus
  - gesture-detector
  - forms
  - ux
environment:
  sdk: ">=3.11.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  melos: ^7.5.1
  very_good_analysis: ^10.2.0

melos:
  repository: https://github.com/thomas-p95/unfocus_widget
  sdkPath: .fvm/flutter_sdk
  useRootAsPackage: true
  ide:
    intellij:
      enabled: false
  command:
    version:
      includeCommitId: true
      linkToCommits: true
      includeScopes: true
      workspaceChangelog: false
      changelogCommitBodies:
        include: true
        onlyBreaking: false
      message: "chore(release): Version{new_package_versions} \U0001F389"
