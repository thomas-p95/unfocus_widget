name: unfocus_widget
description: Dismiss the Flutter keyboard when tapping outside TextField widgets. Lightweight unfocus helper for forms, login screens, and search fields.
version: 0.1.2+5
homepage: https://simpleman.dev
repository: https://github.com/thomas-p95/unfocus_widget
issue_tracker: https://github.com/thomas-p95/unfocus_widget/issues
topics:
  - keyboard
  - textfield
  - unfocus
  - forms
  - ux
environment:
  sdk: ">=3.11.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  melos: ^8.2.0
  very_good_analysis: ^10.2.0

melos:
  repository: https://github.com/thomas-p95/unfocus_widget
  useRootAsPackage: true
  ide:
    intellij:
      enabled: false
  command:
    version:
      includeCommitId: true
      linkToCommits: true
      includeScopes: true
      workspaceChangelog: false
      changelogCommitBodies:
        include: true
        onlyBreaking: false
      message: "chore(release): Version{new_package_versions} \U0001F389"
